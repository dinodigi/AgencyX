# Windows-first packaging (brief §7.2/§7.3). Produces a signed NSIS installer
# published to GitHub Releases; electron-updater reads that feed for self-update.
# Code signing (§7.3): set CSC_LINK + CSC_KEY_PASSWORD in CI (Authenticode cert,
# OV or EV — roadmap open decision #2). Mac target adds later as a build matrix.
appId: com.dinosales.agencyx
productName: AgencyX
# Rebuild native deps (better-sqlite3, keytar) for Electron's ABI at package time.
npmRebuild: true
# pnpm symlinks node_modules; let electron-builder follow them when collecting deps.
buildDependenciesFromSource: false
nodeGypRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# Native modules are unpacked so they load at runtime.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"
  - "**/node_modules/keytar/**"
win:
  target:
    - target: nsis
      arch: [x64]
  # Version-less, space-less asset name so the web app can link the permanent
  # "latest" URL: github.com/dinodigi/AgencyX/releases/latest/download/AgencyX-Setup.exe
  # (each release still carries its own latest.yml for electron-updater).
  artifactName: AgencyX-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: dinodigi
  repo: AgencyX
