name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: AgentX schema guardrails
        run: node agentx/lint.mjs

      - name: Typecheck
        run: pnpm typecheck
