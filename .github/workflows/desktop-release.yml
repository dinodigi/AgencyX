# Desktop build/sign/release (brief §7.2/§7.3). Triggered by a version tag
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`). Builds the Windows NSIS
# installer with electron-builder and publishes it to GitHub Releases;
# electron-updater reads that feed for self-update.
name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {} # allow a manual run without a tag (produces artifacts, no publish)

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tagged release without the delivery token would ship an installer whose
      # sign-in can't reach AgentX. Fail fast instead of publishing a dud.
      - name: Require AGENTX_DELIVERY_TOKEN on tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ -z "${{ secrets.AGENTX_DELIVERY_TOKEN }}" ]; then
            echo "::error::Repo secret AGENTX_DELIVERY_TOKEN is not set (Settings → Secrets → Actions). The packaged app needs it baked in."
            exit 1
          fi

      # Present is not the same as correct. v0.1.1 shipped with the MCP token
      # under this name — a full-trust credential in a public binary — because
      # nothing verified the SCOPE. Ask the API before baking it in.
      - name: Verify the token is delivery-scoped, not MCP
        if: startsWith(github.ref, 'refs/tags/')
        run: pnpm --filter @dinosales/desktop check:token
        env:
          AGENTX_DELIVERY_TOKEN: ${{ secrets.AGENTX_DELIVERY_TOKEN }}

      # electron-builder rebuilds native deps (better-sqlite3, keytar) for
      # Electron's ABI during packaging; windows-latest has the C++ toolchain.
      # If the rebuild is imperfect the app still runs (in-memory/file fallbacks).
      - name: Build + publish installer
        run: pnpm --filter @dinosales/desktop ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'dist' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Baked into the main bundle by build.mjs (delivery-scoped; data access
          # still requires the user's Clerk JWT — see apps/desktop/.env.example).
          AGENTX_DELIVERY_TOKEN: ${{ secrets.AGENTX_DELIVERY_TOKEN }}
          # Clerk publishable key comes from the committed apps/desktop/.env.production.
          # Code signing (§7.3) — OPTIONAL. Set these repo secrets to sign the
          # installer (kills the SmartScreen warning); without them it's unsigned.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact (also available on manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: lead-engine-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: warn
